<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hello World</title>
  <style>
    :root { color-scheme: light dark; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: linear-gradient(135deg, #6a11cb 0%, #2575fc 100%);
      color: #fff;
    }
    h1 {
      font-size: clamp(2.5rem, 8vw, 5rem);
      margin: 0;
      color: orange;
      text-decoration: underline;
    }
    p {
      font-size: 1.1rem;
      opacity: 0.85;
    }
    .datacenter {
      width: clamp(180px, 40vw, 320px);
      height: auto;
      margin-top: 2rem;
    }
    .box {
      border: 3px solid red;
      border-radius: 8px;
      padding: 2rem;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
  </style>
</head>
<body>
  <div class="box">
  <h1>Hello, World!</h1>
  <p>Welcome to my simple website.</p>

  <svg class="datacenter" viewBox="0 0 240 160" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Data center with server racks">
    <!-- floor -->
    <line x1="10" y1="150" x2="230" y2="150" stroke="rgba(255,255,255,0.5)" stroke-width="2"/>

    <!-- three server racks -->
    <g fill="#1f2937" stroke="orange" stroke-width="2">
      <rect x="30"  y="40" width="45" height="110" rx="4"/>
      <rect x="98"  y="40" width="45" height="110" rx="4"/>
      <rect x="166" y="40" width="45" height="110" rx="4"/>
    </g>

    <!-- rack units + status lights -->
    <g>
      <g fill="#374151">
        <rect x="36"  y="48" width="33" height="10" rx="2"/>
        <rect x="36"  y="64" width="33" height="10" rx="2"/>
        <rect x="36"  y="80" width="33" height="10" rx="2"/>
        <rect x="36"  y="96" width="33" height="10" rx="2"/>
        <rect x="36"  y="112" width="33" height="10" rx="2"/>
        <rect x="36"  y="128" width="33" height="10" rx="2"/>

        <rect x="104" y="48" width="33" height="10" rx="2"/>
        <rect x="104" y="64" width="33" height="10" rx="2"/>
        <rect x="104" y="80" width="33" height="10" rx="2"/>
        <rect x="104" y="96" width="33" height="10" rx="2"/>
        <rect x="104" y="112" width="33" height="10" rx="2"/>
        <rect x="104" y="128" width="33" height="10" rx="2"/>

        <rect x="172" y="48" width="33" height="10" rx="2"/>
        <rect x="172" y="64" width="33" height="10" rx="2"/>
        <rect x="172" y="80" width="33" height="10" rx="2"/>
        <rect x="172" y="96" width="33" height="10" rx="2"/>
        <rect x="172" y="112" width="33" height="10" rx="2"/>
        <rect x="172" y="128" width="33" height="10" rx="2"/>
      </g>
      <g fill="#4ade80">
        <circle cx="41" cy="53" r="2"/><circle cx="41" cy="69" r="2"/><circle cx="41" cy="85" r="2"/>
        <circle cx="41" cy="101" r="2"/><circle cx="41" cy="117" r="2"/><circle cx="41" cy="133" r="2"/>
        <circle cx="109" cy="53" r="2"/><circle cx="109" cy="69" r="2"/><circle cx="109" cy="85" r="2"/>
        <circle cx="109" cy="101" r="2"/><circle cx="109" cy="117" r="2"/><circle cx="109" cy="133" r="2"/>
        <circle cx="177" cy="53" r="2"/><circle cx="177" cy="69" r="2"/><circle cx="177" cy="85" r="2"/>
        <circle cx="177" cy="101" r="2"/><circle cx="177" cy="117" r="2"/><circle cx="177" cy="133" r="2"/>
      </g>
    </g>
  </svg>
  </div>
</body>
</html>
