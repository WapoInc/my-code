# Paste in the VDOM containing internal, SA-North-Pri and SA-North-Sec.
# Back up the configuration first. These must be standalone interfaces, not zone/SD-WAN members.
# Address/group names must be unused or already match these exact lab networks.
# edit 0 allocates new policy IDs; paste once to avoid duplicate policies.
# Move these policies above any matching deny or broader allow/NAT policy.
# Central SNAT, if enabled, must also exempt this traffic from translation.
# Routing/BGP must provide both directions; these policies do not configure routing.

config firewall address
    edit "ERLab-OnPrem-172.22.1.0_24"
        set subnet 172.22.1.0 255.255.255.0
    next
    edit "ERLab-Hub-10.30.0.0_24"
        set subnet 10.30.0.0 255.255.255.0
    next
    edit "ERLab-Spoke1-10.31.0.0_24"
        set subnet 10.31.0.0 255.255.255.0
    next
    edit "ERLab-Spoke2-10.32.0.0_24"
        set subnet 10.32.0.0 255.255.255.0
    next
    edit "ERLab-Spoke3-10.33.0.0_24"
        set subnet 10.33.0.0 255.255.255.0
    next
end

config firewall addrgrp
    edit "ERLab-Azure-Networks"
        set member "ERLab-Hub-10.30.0.0_24" "ERLab-Spoke1-10.31.0.0_24" "ERLab-Spoke2-10.32.0.0_24" "ERLab-Spoke3-10.33.0.0_24"
    next
end

config firewall policy
    edit 0
        set name "ERLab-LAN-to-Pri"
        set srcintf "internal"
        set dstintf "SA-North-Pri"
        set srcaddr "ERLab-OnPrem-172.22.1.0_24"
        set dstaddr "ERLab-Azure-Networks"
        set action accept
        set schedule "always"
        set service "PING" "SSH" "HTTP" "HTTPS"
        set nat disable
        set logtraffic all
    next
    edit 0
        set name "ERLab-Pri-to-LAN"
        set srcintf "SA-North-Pri"
        set dstintf "internal"
        set srcaddr "ERLab-Azure-Networks"
        set dstaddr "ERLab-OnPrem-172.22.1.0_24"
        set action accept
        set schedule "always"
        set service "PING" "SSH" "HTTP" "HTTPS"
        set nat disable
        set logtraffic all
    next
    edit 0
        set name "ERLab-LAN-to-Sec"
        set srcintf "internal"
        set dstintf "SA-North-Sec"
        set srcaddr "ERLab-OnPrem-172.22.1.0_24"
        set dstaddr "ERLab-Azure-Networks"
        set action accept
        set schedule "always"
        set service "PING" "SSH" "HTTP" "HTTPS"
        set nat disable
        set logtraffic all
    next
    edit 0
        set name "ERLab-Sec-to-LAN"
        set srcintf "SA-North-Sec"
        set dstintf "internal"
        set srcaddr "ERLab-Azure-Networks"
        set dstaddr "ERLab-OnPrem-172.22.1.0_24"
        set action accept
        set schedule "always"
        set service "PING" "SSH" "HTTP" "HTTPS"
        set nat disable
        set logtraffic all
    next
end
